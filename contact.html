<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜看板買取ドットJP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body data-page="contact">
<div id="site-header"></div>
<div id="breadcrumb"></div>
<div class="page-title"><div class="container"><h1>お問い合わせ</h1><p>買取のご相談・中古看板のご購入など、お気軽にお問い合わせください。</p></div></div>
<main class="section">
  <div class="container" style="max-width:820px">
    <div id="flowTop">
      <ol class="steps-ind"><li class="on">1. 入力</li><li>2. 確認</li><li>3. 完了</li></ol>
      <div class="notice">※ デモサイトのため、入力内容は送信・保存されません。</div>
      <div id="formView" class="panel">
        <div class="product-ref" id="productRef" hidden></div>
        <form id="contactForm" novalidate>
          <div class="row2">
            <div class="field"><label for="name">お名前 <span class="req">必須</span></label><input type="text" id="name" required data-label="お名前"></div>
            <div class="field"><label for="company">会社名 <span class="opt">任意</span></label><input type="text" id="company" data-label="会社名"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="email">メールアドレス <span class="req">必須</span></label><input type="email" id="email" required data-label="メールアドレス"></div>
            <div class="field"><label for="tel">電話番号 <span class="opt">任意</span></label><input type="tel" id="tel" data-label="電話番号"></div>
          </div>
          <div class="field"><label for="kind">お問い合わせ種別 <span class="req">必須</span></label>
            <select id="kind" name="kind" required data-label="お問い合わせ種別"><option value="">選択してください</option><option>看板の買取について</option><option>撤去・運搬について</option><option>中古看板の購入について</option><option>その他</option></select></div>
          <div class="field"><label for="message">お問い合わせ内容 <span class="req">必須</span></label><textarea id="message" name="message" required data-label="お問い合わせ内容"></textarea></div>
          <div class="agree field"><label><input type="checkbox" required data-label="個人情報の取り扱い"> <span><a href="privacy.html" target="_blank" style="color:var(--blue);text-decoration:underline">個人情報の取り扱い</a>に同意する <span class="req">必須</span></span></label></div>
          <div class="btn-row"><button class="btn btn-primary btn-lg" type="submit">入力内容を確認する ›</button></div>
        </form>
      </div>
      <div id="confirmView" class="panel" hidden>
        <h2>入力内容のご確認</h2>
        <table class="confirm-table"><tbody id="confirmBody"></tbody></table>
        <div class="btn-row"><button class="btn btn-outline" id="backBtn" type="button">‹ 修正する</button><button class="btn btn-primary btn-lg" id="sendBtn" type="button">この内容で送信（デモ）</button></div>
      </div>
      <div id="doneView" class="panel" hidden>
        <div class="done"><div class="ok"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
          <h2>送信が完了しました（デモ）</h2>
          <p style="margin:10px 0">受付番号：<b id="receiptNo"></b></p>
          <p style="font-size:13px;color:var(--sub)">※ これはデモ表示です。実際の送信・保存は行われていません。</p>
          <div class="btn-row"><a class="btn btn-outline" href="index.html">トップへ戻る</a><a class="btn btn-primary" href="products.html">中古看板を見る</a></div></div>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/data.js?v=2"></script>
<script src="js/common.js?v=2"></script>
<script src="js/pages.js?v=2"></script>
</body>
</html>
