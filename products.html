<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中古看板販売｜看板買取ドットJP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body data-page="products">
<div id="site-header"></div>
<div id="breadcrumb"></div>
<div class="page-title"><div class="container"><h1>中古看板販売</h1><p>整備済みの中古看板をお探しいただけます。</p></div></div>
<main class="section"><div class="container">
<div class="notice">※ 掲載商品・価格はすべてサンプルです。</div>
<form class="filter" id="filterForm">
  <div class="kw"><label for="kw">キーワード</label><input type="search" id="kw" name="kw" placeholder="商品名・商品番号・材質など"></div>
  <div><label for="cat">看板カテゴリー</label><select id="cat" name="cat"></select></div>
  <div><label for="price">価格帯</label><select id="price" name="price"><option value="">すべて</option><option value="a">〜5万円</option><option value="b">5万〜10万円</option><option value="c">10万〜30万円</option><option value="d">30万円〜</option></select></div>
  <div><label for="status">販売状況</label><select id="status" name="status"><option value="">すべて</option><option value="selling">販売中</option><option value="negotiating">商談中</option><option value="sold">売約済み</option></select></div>
  <div><label for="sort">並び替え</label><select id="sort" name="sort"><option value="new">新着順</option><option value="low">価格が安い順</option><option value="high">価格が高い順</option></select></div>
  <button type="reset" class="btn btn-outline btn-sm">条件クリア</button>
</form>
<div class="result-bar"><span><b id="count">0</b> 件の商品</span></div>
<div class="grid grid-4" id="productGrid"></div>
<div class="empty" id="noResult" hidden>条件に一致する商品が見つかりませんでした。条件を変更してください。</div>
</div></main><div id="site-footer"></div>
<script src="js/data.js?v=2"></script>
<script src="js/common.js?v=2"></script>
<script src="js/pages.js?v=2"></script>
</body>
</html>
